<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A4A" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>
    <linearGradient id="drumRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1E88E5" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#1E88E5" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="266" r="160" fill="none" stroke="#1E88E5" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Machine Body Card -->
  <rect x="116" y="86" width="280" height="340" rx="28" fill="#FFFFFF" filter="url(#shadow)" />

  <!-- Control Header Panel -->
  <rect x="116" y="86" width="280" height="74" rx="28" fill="#F1F5F9" />
  <rect x="116" y="132" width="280" height="28" fill="#F1F5F9" /> <!-- fill bottom corners of header -->
  <line x1="116" y1="160" x2="396" y2="160" stroke="#CBD5E1" stroke-width="2" />

  <!-- Control Panel Elements: Power Button & Dial & LEDs -->
  <circle cx="156" cy="122" r="14" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" />
  <circle cx="156" cy="122" r="6" fill="#10B981" /> <!-- Power on LED -->

  <!-- Rotary Dial -->
  <circle cx="256" cy="122" r="18" fill="#334155" />
  <line x1="256" y1="122" x2="256" y2="108" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />

  <!-- Mini LED Status Indicators -->
  <circle cx="340" cy="116" r="4" fill="#00E5FF" />
  <circle cx="356" cy="116" r="4" fill="#1E88E5" />
  <circle cx="372" cy="116" r="4" fill="#10B981" />
  <!-- Detergent Drawer Slot -->
  <rect x="330" y="128" width="50" height="8" rx="4" fill="#CBD5E1" />

  <!-- Machine Drum Outer Metallic Bezel -->
  <circle cx="256" cy="286" r="96" fill="url(#drumRing)" filter="url(#shadow)" />
  <!-- Glass Window Inner Ring -->
  <circle cx="256" cy="286" r="82" fill="#0F172A" />

  <!-- Water Wave inside Drum -->
  <clipPath id="drumClip">
    <circle cx="256" cy="286" r="80" />
  </clipPath>
  <g clip-path="url(#drumClip)">
    <!-- Water Fill -->
    <path d="M160 270 Q 208 250, 256 270 T 352 270 L 352 380 L 160 380 Z" fill="url(#waterGrad)" />
    <!-- Secondary Wave -->
    <path d="M160 285 Q 210 300, 256 285 T 352 285 L 352 380 L 160 380 Z" fill="#00E5FF" opacity="0.6" />
    
    <!-- Bubbles inside Drum -->
    <circle cx="220" cy="300" r="8" fill="#FFFFFF" opacity="0.8" />
    <circle cx="280" cy="315" r="11" fill="#FFFFFF" opacity="0.75" />
    <circle cx="240" cy="330" r="6" fill="#FFFFFF" opacity="0.9" />
    <circle cx="295" cy="290" r="5" fill="#FFFFFF" opacity="0.7" />

    <!-- Glass Glare / Reflection -->
    <ellipse cx="225" cy="250" rx="36" ry="14" fill="#FFFFFF" opacity="0.25" transform="rotate(-30 225 250)" />
  </g>

  <!-- Door Handle -->
  <circle cx="340" cy="286" r="7" fill="#64748B" stroke="#FFFFFF" stroke-width="2" />

  <!-- Sparkles / Clean stars -->
  <path d="M 400 80 Q 400 95 385 95 Q 400 95 400 110 Q 400 95 415 95 Q 400 95 400 80 Z" fill="#F59E0B" />
  <path d="M 100 200 Q 100 212 88 212 Q 100 212 100 224 Q 100 212 112 212 Q 100 212 100 200 Z" fill="#00E5FF" />
  <path d="M 410 380 Q 410 390 400 390 Q 410 390 410 400 Q 410 390 420 390 Q 410 390 410 380 Z" fill="#10B981" />

  <!-- Bottom Brand Text -->
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="2">BLUE WAVE</text>
  <text x="256" y="495" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600" font-size="12" fill="#38BDF8" letter-spacing="4">LAUNDRY EXPRESS</text>
</svg>
