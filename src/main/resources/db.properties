# ==============================================================
# Database Configuration for Laundry Management System
# ==============================================================
# By default, connects to local MySQL service.
# If MySQL is not running, or for testing/demo purposes,
# db.fallback.h2 can be set to true to gracefully run an embedded
# database so the application opens and functions immediately.

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/laundry_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.username=root
db.password=root

# Set to true to automatically create schema and default services if not present
db.auto.init=true

# Allow fallback to embedded H2 if MySQL server is unreachable
db.fallback.h2=true
db.h2.url=jdbc:h2:./data/laundry_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
db.h2.driver=org.h2.Driver
db.h2.username=sa
db.h2.password=
